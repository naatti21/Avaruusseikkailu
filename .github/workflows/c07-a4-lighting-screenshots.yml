name: C-07 A4 automatic desktop lighting screenshots

on:
  pull_request:
    paths:
      - "native-prototype/tools/c07_a4_lighting_capture.gd"
      - "native-prototype/scripts/c07_a4_android_benchmark.gd"
      - ".github/workflows/c07-a4-lighting-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Install Godot 4.7.2 and Xvfb
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          base="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          curl --fail --location --retry 3 "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          cp "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot-runner"
          chmod +x "$RUNNER_TEMP/godot-runner"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Capture all eight views
        shell: bash
        run: |
          set -euo pipefail
          godot-runner --headless --editor --path native-prototype --quit
          export C07_CAPTURE_DIR="$PWD/docs/c07-v4/lighting-captures"
          xvfb-run -a -s '-screen 0 1600x1200x24' \
            godot-runner --audio-driver Dummy --path native-prototype \
            --rendering-method gl_compatibility \
            --script res://tools/c07_a4_lighting_capture.gd
          test "$(find "$C07_CAPTURE_DIR" -maxdepth 1 -name '*.png' | wc -l)" -eq 8
      - uses: actions/upload-artifact@v4
        with:
          name: c07-a4-four-light-modes-screenshots
          path: docs/c07-v4/lighting-captures/
          retention-days: 14
      - name: Publish captures to design branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/c07-v4/lighting-captures/
          if ! git diff --cached --quiet; then
            git commit -m "docs: save Godot lighting screenshots [skip ci]"
            git push origin "HEAD:refs/heads/${{ github.head_ref }}"
          fi
